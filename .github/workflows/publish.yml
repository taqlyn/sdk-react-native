name: Publish to NPM

# Publish after com.taqlyn:taqlyn-sdk (Maven Central) and TaqlynSDK (SPM/CocoaPods)
# are on their registries. This repo cannot wait on those other repositories.

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install npm for trusted publishing
        run: npm install -g npm@11.5.2
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Run code generation
        run: bun run codegen
      - name: Build library
        run: bun run build
      - name: Publish to NPM (OIDC Trusted Publishing)
        run: npm publish --provenance --access public
